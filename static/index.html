<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>医疗Agent问答</title>
    <style>
        /* ===== 全局样式 ===== */
        body { max-width: 1400px; margin: 20px auto; padding: 0 20px; font-family: Arial, sans-serif; }
        h2 { margin-top: 0; }

        /* ===== 模式切换按钮 ===== */
        .mode-btn { padding: 8px 16px; border: 2px solid #ccc; background: #f5f5f5; cursor: pointer; border-radius: 6px; font-size: 14px; font-weight: normal; color: #555; transition: all 0.2s ease; }
        .mode-btn:hover { background: #e8e8e8; border-color: #aaa; }
        .mode-btn.active { background: #1a73e8; color: #ffffff; font-weight: bold; border-color: #1a73e8; box-shadow: 0 2px 8px rgba(26, 115, 232, 0.4); }

        /* ===== 主布局 ===== */
        .main-container { display: flex; gap: 16px; min-height: calc(100vh - 160px); height: auto; }

        /* ===== 侧边栏 ===== */
        .sidebar { width: 220px; min-width: 180px; background: #f5f5f5; border-right: 1px solid #ddd; padding: 12px; overflow-y: auto; flex-shrink: 0; border-radius: 8px 0 0 8px; }
        .sidebar .tab-btn { display: block; width: 100%; padding: 10px 12px; border: none; background: transparent; text-align: left; font-size: 14px; cursor: pointer; border-radius: 6px; margin-bottom: 4px; position: relative; }
        .sidebar .tab-btn:hover { background: #e8e8e8; }
        .sidebar .tab-btn.active { background: #1a73e8; color: white; }
        .sidebar .badge { float: right; background: #e74c3c; color: white; border-radius: 50%; padding: 0 8px; font-size: 12px; line-height: 20px; min-width: 20px; text-align: center; }
        .sidebar .tab-content { display: none; margin-top: 10px; }
        .sidebar .tab-content.active { display: block; }
        .sidebar .tab-content p { font-size: 12px; color: #888; margin: 4px 0; }

        /* ===== 会话管理 ===== */
        .session-section { margin-top: 8px; border-top: 1px solid #ddd; padding-top: 8px; }
        .session-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; }
        .session-header .session-label { font-size: 12px; font-weight: bold; color: #555; }
        .session-header .session-new-btn { font-size: 12px; padding: 2px 10px; background: #1a73e8; color: #fff; border: none; border-radius: 4px; cursor: pointer; }
        .session-header .session-new-btn:hover { background: #1557b0; }
        #sessionList { max-height: 180px; overflow-y: auto; font-size: 13px; }
        .session-item { padding: 6px 10px; border-radius: 4px; cursor: pointer; display: flex; justify-content: space-between; align-items: center; font-size: 13px; margin-bottom: 2px; transition: background 0.2s; }
        .session-item:hover { background: #e8f0fe; }
        .session-item.active { background: #d2e3fc; font-weight: bold; }
        .session-item .session-name { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .session-item .session-delete { color: #999; font-size: 14px; cursor: pointer; padding: 0 4px; display: none; }
        .session-item:hover .session-delete { display: inline; }
        .session-item .session-delete:hover { color: #e74c3c; }

        /* ===== 聊天区 ===== */
        .chat-area { flex: 1; display: flex; flex-direction: column; min-width: 0; }
        #chat { flex: 1; border: 1px solid #ccc; overflow-y: auto; padding: 15px; background: #fafafa; border-radius: 8px; margin-bottom: 10px; height: 500px; max-height: calc(100vh - 300px); }
        .user { text-align: right; color: #1a73e8; margin: 8px 0; white-space: pre-wrap; word-wrap: break-word; }
        .assistant { text-align: left; color: #2e7d32; margin: 8px 0; white-space: pre-wrap; word-wrap: break-word; }
        .assistant a { color: #1a73e8; text-decoration: underline; }
        .assistant a:hover { color: #1557b0; }
        .tool-info { font-size: 0.8em; color: #5f6368; margin-top: 4px; }

        /* ===== 输入区 ===== */
        .input-area { display: flex; gap: 10px; flex-shrink: 0; align-items: flex-start; }
        .input-area textarea { flex: 1; padding: 10px; font-size: 16px; border: 1px solid #ccc; border-radius: 6px; resize: none; font-family: inherit; height: 42px; min-height: 42px; max-height: 200px; overflow-y: auto; box-sizing: border-box; }
        .input-area button { padding: 10px 24px; font-size: 16px; background: #1a73e8; color: #fff; border: none; border-radius: 6px; cursor: pointer; height: 42px; flex-shrink: 0; }
        .input-area button:hover { background: #1557b0; }
        .mode-selector { margin-bottom: 10px; flex-shrink: 0; display: flex; gap: 8px; }

        /* ===== 审批列表 ===== */
        #approval-list ul { list-style: none; padding: 0; margin: 0; }
        #approval-list li { padding: 8px 0; border-bottom: 1px solid #eee; }
        #approval-list li strong { font-size: 14px; }
        #approval-list li small { color: #888; font-size: 12px; display: block; margin-top: 2px; }
        #approval-list .empty { color: #888; text-align: center; padding: 20px 0; }
        #approval-list .refresh-btn { margin-top: 10px; width: 100%; padding: 8px; background: #e8e8e8; border: none; border-radius: 4px; cursor: pointer; }
        #approval-list .refresh-btn:hover { background: #ddd; }

        /* 上传进度条 */
        .upload-progress { display: none; margin: 10px 0; padding: 12px 16px; background: #f5f5f5; border-radius: 8px; }
        .upload-progress.active { display: block; }
        .upload-progress .progress-bar { width: 100%; height: 6px; background: #e0e0e0; border-radius: 3px; overflow: hidden; margin-top: 8px; }
        .upload-progress .progress-bar .fill { height: 100%; width: 0%; background: #1a73e8; border-radius: 3px; transition: width 0.3s ease; }
        .upload-progress .progress-text { font-size: 13px; color: #555; }

        /* ===== Trace 模态框 ===== */
        .trace-modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 1000; justify-content: center; align-items: center; }
        .trace-modal.active { display: flex; }
        .trace-modal .modal-content { background: #fff; width: 90%; max-width: 800px; max-height: 80vh; border-radius: 12px; padding: 24px; overflow-y: auto; box-shadow: 0 4px 20px rgba(0,0,0,0.3); }
        .trace-modal .modal-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #eee; padding-bottom: 12px; margin-bottom: 16px; }
        .trace-modal .modal-header h3 { margin: 0; }
        .trace-modal .modal-close { background: none; border: none; font-size: 24px; cursor: pointer; color: #888; }
        .trace-modal .modal-close:hover { color: #333; }
        .trace-step { border-left: 3px solid #1a73e8; padding-left: 16px; margin-bottom: 16px; background: #f8f9fa; border-radius: 4px; padding: 12px 16px; }
        .trace-step .step-header { font-weight: bold; color: #1a73e8; margin-bottom: 4px; }
        .trace-step .step-header .step-time { font-weight: normal; color: #888; font-size: 12px; margin-left: 8px; }
        .trace-step .step-detail { font-size: 13px; color: #333; white-space: pre-wrap; word-wrap: break-word; }
        .trace-step .step-detail code { background: #e8e8e8; padding: 2px 6px; border-radius: 3px; font-size: 12px; }
        .trace-step .step-detail .tool-list { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 4px; }
        .trace-step .step-detail .tool-tag { background: #e8f0fe; color: #1a73e8; padding: 2px 10px; border-radius: 12px; font-size: 12px; }
        .trace-btn { font-size: 12px; color: #888; background: none; border: none; cursor: pointer; margin-top: 4px; padding: 2px 8px; border-radius: 4px; }
        .trace-btn:hover { background: #f0f0f0; color: #1a73e8; }

        /* ===== 审批详情模态框 ===== */
        .approval-detail-modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 1000; justify-content: center; align-items: center; }
        .approval-detail-modal.active { display: flex; }
        .approval-detail-modal .modal-content { background: #fff; width: 90%; max-width: 700px; max-height: 80vh; border-radius: 12px; padding: 24px; overflow-y: auto; box-shadow: 0 4px 20px rgba(0,0,0,0.3); }
        .approval-detail-modal .modal-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #eee; padding-bottom: 12px; margin-bottom: 16px; }
        .approval-detail-modal .modal-header h3 { margin: 0; }
        .approval-detail-modal .modal-close { background: none; border: none; font-size: 24px; cursor: pointer; color: #888; }
        .approval-detail-modal .modal-close:hover { color: #333; }
        .approval-detail-modal .detail-field { margin-bottom: 12px; }
        .approval-detail-modal .detail-field .label { font-weight: bold; color: #555; font-size: 13px; margin-bottom: 2px; }
        .approval-detail-modal .detail-field .value { font-size: 14px; color: #333; background: #f5f5f5; padding: 8px 12px; border-radius: 4px; white-space: pre-wrap; word-wrap: break-word; }
        .approval-detail-modal .status-badge { display: inline-block; padding: 2px 12px; border-radius: 12px; font-size: 13px; font-weight: bold; }
        .approval-detail-modal .status-badge.pending { background: #fff3cd; color: #856404; }
        .approval-detail-modal .status-badge.approved { background: #d4edda; color: #155724; }
        .approval-detail-modal .status-badge.rejected { background: #f8d7da; color: #721c24; }

        /* ===== 审批列表（增强版） ===== */
        #approval-list ul { list-style: none; padding: 0; margin: 0; }
        #approval-list li { padding: 10px 12px; border-bottom: 1px solid #eee; border-radius: 6px; cursor: pointer; transition: all 0.2s ease; }
        #approval-list li:hover { background: #e8f0fe; transform: translateX(4px); box-shadow: 0 2px 8px rgba(0,0,0,0.06); }
        #approval-list li:active { transform: scale(0.98); }
        #approval-list li .approval-id { font-weight: bold; color: #1a73e8; font-size: 13px; }
        #approval-list li .approval-title { font-size: 14px; color: #333; margin-left: 6px; }
        #approval-list li .approval-meta { color: #888; font-size: 12px; display: block; margin-top: 4px; }
        #approval-list li .click-hint { float: right; color: #aaa; font-size: 12px; opacity: 0; transition: opacity 0.3s ease; }
        #approval-list li:hover .click-hint { opacity: 1; }
        #approval-list .empty { color: #888; text-align: center; padding: 20px 0; }
        #approval-list .refresh-btn { margin-top: 10px; width: 100%; padding: 8px; background: #e8e8e8; border: none; border-radius: 4px; cursor: pointer; }
        #approval-list .refresh-btn:hover { background: #ddd; }
    </style>
</head>
<body>
    <h2>🏥 医学问答助手</h2>
    <div class="main-container">

        <!-- ===== 侧边栏 ===== -->
        <div class="sidebar" id="sidebar">
            <div class="tab-btn active" data-tab="chat" onclick="switchTab('chat')">💬 医药助手</div>
            <div class="tab-btn" data-tab="approval" onclick="switchTab('approval')">
                📋 审批助手
                <span class="badge" id="approval-badge">0</span>
            </div>
            <div class="tab-content active" id="tab-chat">
                <p>当前租户：<span id="tenant-display">default</span></p>
                <!-- ===== 会话管理区域 ===== -->
                <div class="session-section">
                    <div class="session-header">
                        <span class="session-label">💬 会话</span>
                        <button class="session-new-btn" onclick="createNewSession()">+ 新建</button>
                    </div>
                    <div id="sessionList"></div>
                </div>
                <p style="font-size:12px; color:#aaa; margin-top:8px;">💡 智能问诊输入「我是XXX」绑定患者</p>
            </div>
            <div class="tab-content" id="tab-approval">
                <div id="approval-list"><p class="empty">加载中...</p></div>
                <button class="refresh-btn" onclick="refreshApprovals()">🔄 刷新</button>
            </div>
        </div>

        <!-- ===== 聊天区 ===== -->
        <div class="chat-area">
            <div class="mode-selector">
                <button id="mode-quick" class="mode-btn active" onclick="setMode('quick')">⚡ 快速问答</button>
                <button id="mode-consult" class="mode-btn" onclick="setMode('consult')">🩺 智能问诊</button>
            </div>
            <div id="chat"></div>

            <!-- 上传进度条 -->
            <div class="upload-progress" id="uploadProgress">
                <div class="progress-text" id="progressText">📤 正在上传...</div>
                <div class="progress-bar">
                    <div class="fill" id="progressFill"></div>
                </div>
            </div>

            <div class="input-area">
                <input type="file" id="fileInput" accept=".png,.jpg,.jpeg,.pdf,.docx,.xlsx" multiple style="display:none;">
                <button onclick="document.getElementById('fileInput').click()" style="padding:10px 16px; background:#1a73e8; color:#ffffff; border:none; border-radius:6px; cursor:pointer; font-weight:500; white-space:nowrap;">📎 上传文件</button>
                <textarea id="question" placeholder="输入医学问题...（Shift+Enter 换行）" rows="1" style="flex:1; padding:10px; font-size:16px; border:1px solid #ccc; border-radius:6px; resize:none; font-family:inherit; min-height:42px; max-height:200px; overflow-y:auto;"></textarea>
                <button onclick="send()">发送</button>
            </div>
        </div>
    </div>

    <!-- ===== Trace 模态框 ===== -->
    <div class="trace-modal" id="traceModal">
        <div class="modal-content">
            <div class="modal-header">
                <h3>🔍 推理过程</h3>
                <button class="modal-close" onclick="closeTrace()">&times;</button>
            </div>
            <div id="traceBody"><p style="color:#888;">加载中...</p></div>
        </div>
    </div>

    <!-- ===== 审批详情模态框 ===== -->
    <div class="approval-detail-modal" id="approvalDetailModal">
        <div class="modal-content">
            <div class="modal-header">
                <h3 id="approvalDetailTitle">📋 审批详情</h3>
                <button class="modal-close" onclick="closeApprovalDetail()">&times;</button>
            </div>
            <div id="approvalDetailBody"><p style="color:#888;">加载中...</p></div>
        </div>
    </div>

    <script>
        // ============================================================
        // 会话 ID 管理
        // ============================================================
        function getSessionId() {
            let sessionId = localStorage.getItem('med_agent_session_id');
            if (!sessionId) {
                sessionId = 'session_' + Date.now() + '_' + Math.random().toString(36).substring(2, 8);
                localStorage.setItem('med_agent_session_id', sessionId);
            }
            return sessionId;
        }
        let SESSION_ID = getSessionId();
        console.log('[Session] ID:', SESSION_ID);

        // ============================================================
        // 全局状态
        // ============================================================
        let currentMode = 'quick';
        let currentTab = 'chat';
        const conversations = { chat_quick: [], chat_consult: [], approval: [] };
        let activeRequestId = 0;

        // ============================================================
        // 工具函数
        // ============================================================
        function getCurrentConversationKey() {
            if (currentTab === 'approval') return 'approval';
            if (currentMode === 'quick') return 'chat_quick';
            return 'chat_consult';
        }
        function getCurrentConversation() {
            return conversations[getCurrentConversationKey()] || [];
        }

        // ============================================================
        // 模式切换
        // ============================================================
        function setMode(mode) {
            activeRequestId++;
            currentMode = mode;
            document.getElementById('mode-quick').classList.toggle('active', mode === 'quick');
            document.getElementById('mode-consult').classList.toggle('active', mode === 'consult');
            const chatDiv = document.getElementById('chat');
            chatDiv.innerHTML = '';
            const key = getCurrentConversationKey();
            const saved = conversations[key] || [];
            saved.forEach(msg => {
                renderMessage(msg.role, msg.content, msg.tools || null, null);
            });
        }

        // ============================================================
        // Tab 切换
        // ============================================================
        function switchTab(tab) {
            activeRequestId++;
            currentTab = tab;
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            document.querySelector(`.tab-btn[data-tab="${tab}"]`).classList.add('active');
            document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
            document.getElementById(`tab-${tab}`).classList.add('active');
            const chatDiv = document.getElementById('chat');
            chatDiv.innerHTML = '';
            const key = getCurrentConversationKey();
            const saved = conversations[key] || [];
            saved.forEach(msg => {
                renderMessage(msg.role, msg.content, msg.tools || null, null);
            });
            const modeSelector = document.querySelector('.mode-selector');
            if (tab === 'approval') {
                modeSelector.style.display = 'none';
                refreshApprovals();
            } else {
                modeSelector.style.display = 'flex';
            }
        }

        // ============================================================
        // 渲染消息
        // ============================================================
        function renderMessage(role, text, toolsUsed, traceSessionId) {
            toolsUsed = toolsUsed || null;
            traceSessionId = traceSessionId || null;
            const chatDiv = document.getElementById('chat');
            const msgDiv = document.createElement('div');
            msgDiv.className = role;
            let formattedText = text.replace(/\n/g, '<br>');
            formattedText = formattedText.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>');
            formattedText = formattedText.replace(
                /\[([^\]]+)\]\(([^)]+)\)/g,
                function(match, linkText, url) {
                    if (url.startsWith('/reports/')) {
                        const filename = url.split('/').pop();
                        const downloadUrl = window.location.origin + url;
                        const previewUrl = window.location.origin + '/preview/' + filename;
                        return '<a href="' + downloadUrl + '" target="_blank" download style="display:inline-block;margin-right:12px;padding:6px 16px;background:#1a73e8;color:#fff;border-radius:4px;text-decoration:none;">📥 下载评估表</a>' +
                            '<a href="' + previewUrl + '" target="_blank" style="display:inline-block;padding:6px 16px;background:#e8f0fe;color:#1a73e8;border-radius:4px;text-decoration:none;border:1px solid #1a73e8;">👁️ 预览评估表</a>';
                    }
                    return '<a href="' + url + '" target="_blank">' + linkText + '</a>';
                }
            );
            msgDiv.innerHTML = `<strong>${role === 'user' ? '您' : '助手'}:</strong> ${formattedText}`;
            if (toolsUsed && toolsUsed.length) {
                const toolSpan = document.createElement('div');
                toolSpan.className = 'tool-info';
                toolSpan.innerText = `🔧 使用工具: ${toolsUsed.join(', ')}`;
                msgDiv.appendChild(toolSpan);
            }
            if (role === 'assistant' && traceSessionId && currentMode === 'quick') {
                const traceBtn = document.createElement('button');
                traceBtn.className = 'trace-btn';
                traceBtn.textContent = '🔍 查看推理过程';
                traceBtn.onclick = () => showTrace(traceSessionId);
                msgDiv.appendChild(traceBtn);
            }
            chatDiv.appendChild(msgDiv);
            chatDiv.scrollTop = chatDiv.scrollHeight;
        }

        // ============================================================
        // 审批列表刷新
        // ============================================================
        async function refreshApprovals() {
            try {
                const resp = await fetch('/approvals', { headers: { 'X-Tenant-ID': 'default' } });
                const data = await resp.json();
                document.getElementById('approval-badge').innerText = data.count || 0;
                const listDiv = document.getElementById('approval-list');
                if (data.items && data.items.length) {
                    let html = '<ul>';
                    data.items.forEach(item => {
                        html += `
                            <li onclick="showApprovalDetail('${item.id}')">
                                <span class="approval-id">${item.id}</span>
                                <span class="approval-title">${item.title}</span>
                                <span class="click-hint">👉 点击查看</span>
                                <span class="approval-meta">申请人：${item.requester}  ${item.created_at}</span>
                            </li>
                        `;
                    });
                    html += '</ul>';
                    listDiv.innerHTML = html;
                } else {
                    listDiv.innerHTML = '<p class="empty">✅ 暂无待审批项</p>';
                }
            } catch (err) {
                console.error('刷新审批列表失败:', err);
                document.getElementById('approval-list').innerHTML = '<p class="empty">⚠️ 加载失败</p>';
            }
        }

        // ============================================================
        // ===== 🆕 多文件上传 + 自动发送（方案A1） =====
        // ============================================================
        document.getElementById('fileInput').addEventListener('change', async function(e) {
            const files = this.files;
            if (!files || files.length === 0) return;

            const validExtensions = ['.png', '.jpg', '.jpeg', '.pdf', '.docx', '.xlsx'];
            const validFiles = [];
            for (let f of files) {
                const fileExt = '.' + f.name.split('.').pop().toLowerCase();
                if (validExtensions.includes(fileExt)) validFiles.push(f);
            }
            if (validFiles.length === 0) {
                alert('没有有效的文件（支持 PNG、JPG、PDF、DOCX、XLSX）');
                this.value = '';
                return;
            }

            const total = validFiles.length;
            let completed = 0;
            let allContents = [];

            const progressContainer = document.getElementById('uploadProgress');
            const progressFill = document.getElementById('progressFill');
            const progressText = document.getElementById('progressText');
            progressContainer.classList.add('active');
            progressFill.style.width = '0%';
            progressText.textContent = `📤 正在上传 0/${total} 个文件...`;

            const fileNames = validFiles.map(f => f.name).join('、');
            renderMessage('user', `📎 上传 ${total} 个文件：${fileNames}`, null, null);
            const key = getCurrentConversationKey();
            const conv = conversations[key];
            conv.push({ role: 'user', content: `上传 ${total} 个文件：${fileNames}`, tools: null });

            for (let i = 0; i < validFiles.length; i++) {
                const file = validFiles[i];
                progressText.textContent = `📤 正在上传 ${i+1}/${total} 个文件：${file.name}`;
                progressFill.style.width = `${((i) / total) * 100}%`;
                const formData = new FormData();
                formData.append('file', file);
                formData.append('module', 'consult');
                try {
                    const resp = await fetch('/upload', {
                        method: 'POST',
                        headers: { 'X-Session-ID': SESSION_ID },
                        body: formData
                    });
                    const data = await resp.json();
                    if (data.success) {
                        allContents.push({ filename: file.name, content: data.content });
                    } else {
                        allContents.push({ filename: file.name, content: `❌ 解析失败：${data.error || '未知错误'}` });
                    }
                } catch (err) {
                    allContents.push({ filename: file.name, content: `❌ 上传失败：${err.message}` });
                }
                completed++;
                progressFill.style.width = `${(completed / total) * 100}%`;
                progressText.textContent = `📤 已完成 ${completed}/${total} 个文件...`;
            }
            progressContainer.classList.remove('active');

            // 汇总显示解析结果
            let summary = `📄 已解析 ${total} 个文件：\n\n`;
            for (let item of allContents) {
                const preview = item.content.substring(0, 200) + (item.content.length > 200 ? '...' : '');
                summary += `【${item.filename}】\n${preview}\n\n`;
            }
            renderMessage('assistant', summary, null, null);

            // 🆕 方案A1：将文件内容作为 system 消息存入 conv
            const systemMsg = `【文件内容】\n${allContents.map(item => `${item.filename}:\n${item.content}`).join('\n\n')}`;
            conv.push({ role: 'system', content: systemMsg, tools: null });

            // 🆕 自动发送一条用户消息，触发后端保存
            const autoMsg = `📎 已上传 ${total} 个文件，请根据这些资料分析`;
            renderMessage('user', autoMsg, null, null);
            conv.push({ role: 'user', content: autoMsg, tools: null });

            // 调用 API 获取助手回答
            const thisRequestId = ++activeRequestId;
            const traceSessionId = 'trace_' + Date.now() + '_' + Math.random().toString(36).substring(2, 6);
            const traceQuestion = autoMsg.length > 200 ? autoMsg.substring(0, 200) + '...' : autoMsg;

            try {
                // 启动 trace
                try {
                    const traceResp = await fetch('/trace/start', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ session_id: traceSessionId, question: traceQuestion })
                    });
                    if (!traceResp.ok) console.warn('[Trace] 启动失败');
                    else console.log('[Trace] 启动成功:', traceSessionId);
                } catch (traceErr) { console.warn('[Trace] 启动失败:', traceErr); }

                let endpoint = currentMode === 'quick' ? '/ask' : '/consult';
                if (currentTab === 'approval') endpoint = '/ask';

                const resp = await fetch(endpoint, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'X-Session-ID': SESSION_ID,
                        'X-Conversation-Type': currentTab === 'approval' ? 'approval' : currentMode === 'quick' ? 'quick' : 'consult',
                        'X-Trace-ID': traceSessionId
                    },
                    body: JSON.stringify({
                        question: autoMsg,
                        history: conv.slice(0, -1)  // 不包含刚 push 的 user 消息，但包含 system 消息
                    })
                });
                const data = await resp.json();

                if (thisRequestId !== activeRequestId) {
                    console.log('丢弃过期响应');
                    return;
                }

                const answer = data.result?.answer || '请求失败：请检查后端日志';
                const toolsUsed = data.result?.tools_used || [];
                renderMessage('assistant', answer, toolsUsed, traceSessionId);
                conv.push({ role: 'assistant', content: answer, tools: toolsUsed });

                // 保存当前会话
                saveCurrentSession();

            } catch (err) {
                if (thisRequestId !== activeRequestId) return;
                renderMessage('assistant', '请求失败：' + err.message, null, null);
                conv.push({ role: 'assistant', content: '请求失败：' + err.message, tools: null });
            }

            this.value = '';
        });

        // ============================================================
        // 发送消息
        // ============================================================
       async function send() {
        const input = document.getElementById('question');
        const q = input.value.trim();
        if (!q) return;
        input.value = '';
        input.style.height = '42px';

        let convType = 'quick';
        if (currentTab === 'approval') convType = 'approval';
        else if (currentMode === 'consult') convType = 'consult';

        const key = getCurrentConversationKey();
        const conv = conversations[key];

        renderMessage('user', q, null, null);
        conv.push({ role: 'user', content: q, tools: null });

        const thisRequestId = ++activeRequestId;
        const traceSessionId = 'trace_' + Date.now() + '_' + Math.random().toString(36).substring(2, 6);
        const traceQuestion = q.length > 200 ? q.substring(0, 200) + '...' : q;

        try {
            // 启动 trace
            try {
                const traceResp = await fetch('/trace/start', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ session_id: traceSessionId, question: traceQuestion })
                });
                if (!traceResp.ok) console.warn('[Trace] 启动失败');
                else console.log('[Trace] 启动成功:', traceSessionId);
            } catch (traceErr) { console.warn('[Trace] 启动失败:', traceErr); }

            let endpoint = currentTab === 'approval' ? '/ask' : (currentMode === 'quick' ? '/ask' : '/consult');

            // ===== 前端超时控制 =====
            const controller = new AbortController();
            const timeoutId = setTimeout(() => controller.abort(), 300000);

            const resp = await fetch(endpoint, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'X-Session-ID': SESSION_ID,
                    'X-Conversation-Type': convType,
                    'X-Trace-ID': traceSessionId
                },
                body: JSON.stringify({
                    question: q,
                    history: conv.slice(0, -1)
                }),
                signal: controller.signal
            });
            clearTimeout(timeoutId);

            if (thisRequestId !== activeRequestId) return;

            const data = await resp.json();

            // ===== 检查后端返回的 success 字段 =====
            if (data.success === false) {
                const errorMsg = data.result?.answer || '请求处理失败，请重试';
                renderMessage('assistant', errorMsg, null, null);
                conv.push({ role: 'assistant', content: errorMsg, tools: null });
                saveCurrentSession();
                if (currentTab === 'approval') setTimeout(refreshApprovals, 1000);
                return;
            }

            const answer = data.result?.answer || '请求失败：请检查后端日志';
            const toolsUsed = data.result?.tools_used || [];
            renderMessage('assistant', answer, toolsUsed, traceSessionId);
            conv.push({ role: 'assistant', content: answer, tools: toolsUsed });

            if (currentTab === 'approval') setTimeout(refreshApprovals, 1000);
            saveCurrentSession();

        } catch (err) {
            if (thisRequestId !== activeRequestId) return;

            let errorMsg = '❌ 请求失败：';
            if (err.name === 'AbortError') {
                errorMsg += '⏱️ 请求超时（65秒），请稍后重试。';
            } else if (err.message.includes('Failed to fetch') || err.message.includes('NetworkError')) {
                errorMsg += '🌐 网络连接失败，请检查服务是否正常运行。';
            } else {
                errorMsg += err.message || '未知错误，请重试。';
            }
            renderMessage('assistant', errorMsg, null, null);
            conv.push({ role: 'assistant', content: errorMsg, tools: null });
            saveCurrentSession();
        }
    }

        // ============================================================
        // 回车发送 & 自动调整高度
        // ============================================================
        document.getElementById('question').addEventListener('keydown', function(e) {
            if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); }
        });
        document.getElementById('question').addEventListener('input', function() {
            this.style.height = 'auto';
            this.style.height = Math.min(this.scrollHeight, 200) + 'px';
        });

        // ============================================================
        // 页面加载后初始化
        // ============================================================
        document.addEventListener('DOMContentLoaded', function() {
            initSessions().then(() => {
                switchTab('chat');
                loadHistory();
            });
        });

        // ============================================================
        // 历史加载
        // ============================================================
        async function loadHistory() {
            try {
                const resp = await fetch(`/history?session_id=${SESSION_ID}&limit=50`);
                const data = await resp.json();
                if (data.success && data.items.length > 0) {
                    data.items.forEach(item => {
                        const key = item.conversation_type === 'quick' ? 'chat_quick' :
                            item.conversation_type === 'consult' ? 'chat_consult' : 'approval';
                        if (!conversations[key]) conversations[key] = [];
                        if (item.role === 'user' || item.role === 'assistant') {
                            conversations[key].push({
                                role: item.role,
                                content: item.content,
                                tools: item.tools_used || null
                            });
                        }
                    });
                    refreshCurrentChat();
                }
            } catch (err) { console.error('加载历史记录失败:', err); }
        }

        function refreshCurrentChat() {
            const chatDiv = document.getElementById('chat');
            chatDiv.innerHTML = '';
            const key = getCurrentConversationKey();
            const saved = conversations[key] || [];
            saved.forEach(msg => {
                renderMessage(msg.role, msg.content, msg.tools || null, null);
            });
        }

        // ============================================================
        // Trace 功能
        // ============================================================
        let currentTraceSessionId = null;
        async function showTrace(sessionId) {
            currentTraceSessionId = sessionId;
            const modal = document.getElementById('traceModal');
            const body = document.getElementById('traceBody');
            body.innerHTML = '<p style="color:#888;">加载推理过程...</p>';
            modal.classList.add('active');
            try {
                const resp = await fetch(`/trace/${sessionId}`);
                const data = await resp.json();
                if (!data.success) { body.innerHTML = `<p style="color:#e74c3c;">❌ ${data.error}</p>`; return; }
                const trace = data.data;
                let html = `<p style="font-size:13px; color:#888; margin-bottom:12px;">问题：${trace.question}</p>`;
                html += `<p style="font-size:12px; color:#aaa; margin-bottom:16px;">耗时：${(trace.end_time - trace.start_time || 0).toFixed(2)}s</p>`;
                trace.steps.forEach((step) => {
                    const typeNames = { 'planner': '📋 Planner', 'executor': '⚡ Executor', 'retriever': '🔍 Retriever', 'synthesizer': '🧠 Synthesizer', 'supervisor': '🧭 Supervisor 路由' };
                    const typeName = typeNames[step.step_type] || step.step_type;
                    const time = new Date(step.timestamp * 1000).toLocaleTimeString();
                    html += `<div class="trace-step"><div class="step-header">${typeName} <span class="step-time">${time}</span></div><div class="step-detail">`;
                    const d = step.data;

                    let agentTag = '';
                    if (d.agent) {
                        const agentNames = {'cardiology': '❤️ 心外科', 'pharmacy': '💊 药剂科', 'general': '🏥 全科'};
                        agentTag = `<div style="color:#1a73e8;font-weight:bold;">Agent: ${agentNames[d.agent] || d.agent}</div>`;
                    }
                        html += agentTag;
                    if (step.step_type === 'planner') {
                        html += `<div>📝 规则匹配结果：<code>${d.rule_result?.join(', ') || '无'}</code></div>`;
                        html += `<div>🤖 使用 LLM 规划：${d.used_llm ? '是' : '否'}</div>`;
                        html += `<div>✅ 最终工具：<div class="tool-list">${d.final_tools?.map(t => `<span class="tool-tag">${t}</span>`).join('') || '无'}</div></div>`;
                    } else if (step.step_type === 'executor') {
                        const status = d.success ? '✅' : '❌';
                        html += `<div>${status} 工具：<strong>${d.tool}</strong></div>`;
                        html += `<div>⏱️ 耗时：${d.duration?.toFixed(2)}s</div>`;
                        if (d.success && d.result_preview) html += `<div>📄 结果预览：${d.result_preview}</div>`;
                        if (!d.success && d.error) html += `<div style="color:#e74c3c;">❌ 错误：${d.error}</div>`;
                    } else if (step.step_type === 'retriever') {
                        html += `<div>🔍 原始查询：<code>${d.query}</code></div>`;
                        if (d.rewritten_queries) html += `<div>📝 改写查询：<br><code>${d.rewritten_queries.join('<br>')}</code></div>`;
                        if (d.result_count !== undefined) html += `<div>📊 检索到 ${d.result_count} 条结果</div>`;
                        if (d.top_result_preview) html += `<div>📄 最佳结果预览：${d.top_result_preview}</div>`;
                    } else if (step.step_type === 'synthesizer') {
                        if (d.tool_count !== undefined) html += `<div>📊 合成 ${d.tool_count} 个工具的结果</div>`;
                        if (d.tool_sources) html += `<div>🔧 工具来源：${d.tool_sources?.join(', ') || '无'}</div>`;
                        if (d.answer_preview) html += `<div>📄 合成答案预览：${d.answer_preview}</div>`;
                    }else if (step.step_type === 'supervisor') {
                        html += `<div>🎯 主科室：<strong>${d.primary}</strong></div>`;
                        if (d.secondary && d.secondary.length) {
                            html += `<div>📌 辅助科室：${d.secondary.join(', ')}</div>`;
                        }
                    }
                    html += `</div></div>`;
                });
                body.innerHTML = html;
            } catch (err) { body.innerHTML = `<p style="color:#e74c3c;">❌ 加载失败：${err.message}</p>`; }
        }
        function closeTrace() { document.getElementById('traceModal').classList.remove('active'); }
        document.getElementById('traceModal').addEventListener('click', function(e) { if (e.target === this) closeTrace(); });

        // ============================================================
        // 审批详情功能
        // ============================================================
        async function showApprovalDetail(approvalId) {
            const modal = document.getElementById('approvalDetailModal');
            const body = document.getElementById('approvalDetailBody');
            body.innerHTML = '<p style="color:#888;">加载中...</p>';
            modal.classList.add('active');
            try {
                const resp = await fetch(`/approval/${approvalId}`, { headers: { 'X-Tenant-ID': 'default' } });
                const data = await resp.json();
                if (!data.success) { body.innerHTML = `<p style="color:#e74c3c;">❌ ${data.error}</p>`; return; }
                const d = data.data;
                const statusMap = { 'pending': '⏳ 待审批', 'approved': '✅ 已通过', 'rejected': '❌ 已驳回' };
                const statusClass = d.status || 'pending';
                let html = `
                    <div class="detail-field"><div class="label">审批编号</div><div class="value">${d.id}</div></div>
                    <div class="detail-field"><div class="label">标题</div><div class="value">${d.title}</div></div>
                    <div class="detail-field"><div class="label">状态</div><div class="value"><span class="status-badge ${statusClass}">${statusMap[statusClass] || statusClass}</span></div></div>
                    <div class="detail-field"><div class="label">申请人</div><div class="value">${d.requester}</div></div>
                    <div class="detail-field"><div class="label">审批人</div><div class="value">${d.reviewer || '未分配'}</div></div>
                    <div class="detail-field"><div class="label">申请时间</div><div class="value">${d.created_at}</div></div>
                    <div class="detail-field"><div class="label">审批时间</div><div class="value">${d.reviewed_at || '未审批'}</div></div>
                    <div class="detail-field"><div class="label">详情内容</div><div class="value" style="max-height:300px; overflow-y:auto; white-space:pre-wrap; font-size:13px;">${d.content || '无内容'}</div></div>
                `;
                if (d.comment) html += `<div class="detail-field"><div class="label">驳回原因</div><div class="value">${d.comment}</div></div>`;
                body.innerHTML = html;
                document.getElementById('approvalDetailTitle').textContent = `📋 审批详情 - ${d.id}`;
            } catch (err) { body.innerHTML = `<p style="color:#e74c3c;">❌ 加载失败：${err.message}</p>`; }
        }
        function closeApprovalDetail() { document.getElementById('approvalDetailModal').classList.remove('active'); }
        document.getElementById('approvalDetailModal').addEventListener('click', function(e) { if (e.target === this) closeApprovalDetail(); });

        // ============================================================
        // 会话管理（多会话支持）
        // ============================================================
        const SESSIONS_KEY = 'med_agent_sessions';
        const CURRENT_SESSION_KEY = 'med_agent_current_session';

        function getSessions() { try { const data = localStorage.getItem(SESSIONS_KEY); return data ? JSON.parse(data) : []; } catch { return []; } }
        function saveSessions(sessions) { localStorage.setItem(SESSIONS_KEY, JSON.stringify(sessions)); }
        function getCurrentSessionId() { return localStorage.getItem(CURRENT_SESSION_KEY) || null; }
        function setCurrentSessionId(sessionId) { localStorage.setItem(CURRENT_SESSION_KEY, sessionId); }
        function generateSessionName(sessions) { return `会话 ${sessions.length + 1}`; }

        function createNewSession() {
            const sessions = getSessions();
            const sessionId = 'session_' + Date.now() + '_' + Math.random().toString(36).substring(2, 6);
            sessions.push({ id: sessionId, name: generateSessionName(sessions), created_at: new Date().toISOString(), conversations: { chat_quick: [], chat_consult: [], approval: [] } });
            saveSessions(sessions);
            setCurrentSessionId(sessionId);
            renderSessionList();
            switchToSession(sessionId);
        }

        async function switchToSession(sessionId) {
            const sessions = getSessions();
            const session = sessions.find(s => s.id === sessionId);
            if (!session) return;
            SESSION_ID = sessionId;
            setCurrentSessionId(sessionId);
            conversations.chat_quick = [];
            conversations.chat_consult = [];
            conversations.approval = [];
            try {
                const resp = await fetch(`/history?session_id=${sessionId}&limit=50`);
                const data = await resp.json();
                if (data.success && data.items.length > 0) {
                    data.items.forEach(item => {
                        const key = item.conversation_type === 'quick' ? 'chat_quick' :
                            item.conversation_type === 'consult' ? 'chat_consult' : 'approval';
                        if (!conversations[key]) conversations[key] = [];
                        if (item.role === 'user' || item.role === 'assistant') {
                            conversations[key].push({ role: item.role, content: item.content, tools: item.tools_used || null });
                        }
                    });
                }
                if (session.conversations) {
                    if (conversations.chat_quick.length === 0 && session.conversations.chat_quick) conversations.chat_quick = session.conversations.chat_quick || [];
                    if (conversations.chat_consult.length === 0 && session.conversations.chat_consult) conversations.chat_consult = session.conversations.chat_consult || [];
                    if (conversations.approval.length === 0 && session.conversations.approval) conversations.approval = session.conversations.approval || [];
                }
                session.conversations = { chat_quick: conversations.chat_quick, chat_consult: conversations.chat_consult, approval: conversations.approval };
                saveSessions(sessions);
            } catch (err) { console.error('加载会话历史失败:', err); }
            renderSessionList();
            refreshCurrentChat();
        }

        function deleteSession(sessionId) {
            if (!confirm('确定要删除这个会话吗？')) return;
            let sessions = getSessions();
            sessions = sessions.filter(s => s.id !== sessionId);
            saveSessions(sessions);
            const currentId = getCurrentSessionId();
            if (currentId === sessionId) {
                if (sessions.length > 0) { setCurrentSessionId(sessions[0].id); switchToSession(sessions[0].id); }
                else { createNewSession(); }
            } else { renderSessionList(); }
        }

        function renderSessionList() {
            const container = document.getElementById('sessionList');
            const sessions = getSessions();
            const currentId = getCurrentSessionId();
            if (sessions.length === 0) { container.innerHTML = '<div style="color:#999;font-size:12px;padding:4px 0;">暂无会话</div>'; return; }
            let html = '';
            for (const session of sessions) {
                const active = session.id === currentId ? 'active' : '';
                const displayName = session.name || session.id.substring(0, 12);
                html += `<div class="session-item ${active}" onclick="switchToSession('${session.id}')">
                    <span class="session-name">💬 ${displayName}</span>
                    <span class="session-delete" onclick="event.stopPropagation(); deleteSession('${session.id}')">✕</span>
                </div>`;
            }
            container.innerHTML = html;
        }

        function saveCurrentSession() {
            const sessionId = getCurrentSessionId();
            if (!sessionId) return;
            const sessions = getSessions();
            const session = sessions.find(s => s.id === sessionId);
            if (!session) return;
            session.conversations = { chat_quick: conversations.chat_quick || [], chat_consult: conversations.chat_consult || [], approval: conversations.approval || [] };
            saveSessions(sessions);
        }

        async function initSessions() {
            let sessions = getSessions();
            let currentId = getCurrentSessionId();
            if (sessions.length === 0) {
                const defaultId = SESSION_ID;
                sessions.push({ id: defaultId, name: '默认会话', created_at: new Date().toISOString(), conversations: { chat_quick: [], chat_consult: [], approval: [] } });
                saveSessions(sessions);
                setCurrentSessionId(defaultId);
                currentId = defaultId;
            }
            if (currentId && !sessions.find(s => s.id === currentId)) { currentId = sessions[0].id; setCurrentSessionId(currentId); }
            renderSessionList();
            const targetId = currentId || sessions[0].id;
            SESSION_ID = targetId;
            await switchToSession(targetId);
        }
    </script>
</body>
</html>
