<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>医疗Agent问答</title>
    <style>
        /* ===== 全局样式 ===== */
        body { max-width: 1400px; margin: 20px auto; padding: 0 20px; font-family: Arial, sans-serif; }
        h2 { margin-top: 0; }

        /* ===== 模式切换按钮 ===== */
        .mode-btn { padding: 8px 16px; border: 2px solid #ccc; background: #f5f5f5; cursor: pointer; border-radius: 6px; font-size: 14px; font-weight: normal; color: #555; transition: all 0.2s ease; }
        .mode-btn:hover { background: #e8e8e8; border-color: #aaa; }
        .mode-btn.active { background: #1a73e8; color: #ffffff; font-weight: bold; border-color: #1a73e8; box-shadow: 0 2px 8px rgba(26, 115, 232, 0.4); }

        /* ===== 主布局 ===== */
        .main-container {
            display: flex;
            gap: 16px;
            min-height: calc(100vh - 160px);
            height: auto;
        }

        /* ===== 侧边栏 ===== */
        .sidebar {
            width: 220px;
            min-width: 180px;
            background: #f5f5f5;
            border-right: 1px solid #ddd;
            padding: 12px;
            overflow-y: auto;
            flex-shrink: 0;
            border-radius: 8px 0 0 8px;
        }
        .sidebar .tab-btn {
            display: block;
            width: 100%;
            padding: 10px 12px;
            border: none;
            background: transparent;
            text-align: left;
            font-size: 14px;
            cursor: pointer;
            border-radius: 6px;
            margin-bottom: 4px;
            position: relative;
        }
        .sidebar .tab-btn:hover { background: #e8e8e8; }
        .sidebar .tab-btn.active { background: #1a73e8; color: white; }
        .sidebar .badge {
            float: right;
            background: #e74c3c;
            color: white;
            border-radius: 50%;
            padding: 0 8px;
            font-size: 12px;
            line-height: 20px;
            min-width: 20px;
            text-align: center;
        }
        .sidebar .tab-content { display: none; margin-top: 10px; }
        .sidebar .tab-content.active { display: block; }
        .sidebar .tab-content p { font-size: 12px; color: #888; margin: 4px 0; }

        /* ===== 聊天区 ===== */
        .chat-area {
            flex: 1;
            display: flex;
            flex-direction: column;
            min-width: 0;
        }
        #chat {
            flex: 1;
            border: 1px solid #ccc;
            overflow-y: auto;
            padding: 15px;
            background: #fafafa;
            border-radius: 8px;
            margin-bottom: 10px;
            height: 500px;
            max-height: calc(100vh - 300px);
        }
        .user { text-align: right; color: #1a73e8; margin: 8px 0; white-space: pre-wrap; word-wrap: break-word; }
        .assistant { text-align: left; color: #2e7d32; margin: 8px 0; white-space: pre-wrap; word-wrap: break-word; }
        .assistant a { color: #1a73e8; text-decoration: underline; }
        .assistant a:hover { color: #1557b0; }
        .tool-info { font-size: 0.8em; color: #5f6368; margin-top: 4px; }

        /* ===== 输入区 ===== */
        .input-area { display: flex; gap: 10px; flex-shrink: 0; }
        .input-area input { flex: 1; padding: 10px; font-size: 16px; border: 1px solid #ccc; border-radius: 6px; }
        .input-area button { padding: 10px 24px; font-size: 16px; background: #1a73e8; color: #fff; border: none; border-radius: 6px; cursor: pointer; }
        .input-area button:hover { background: #1557b0; }

        .mode-selector { margin-bottom: 10px; flex-shrink: 0; display: flex; gap: 8px; }

        /* ===== 审批列表 ===== */
        #approval-list ul { list-style: none; padding: 0; margin: 0; }
        #approval-list li { padding: 8px 0; border-bottom: 1px solid #eee; }
        #approval-list li strong { font-size: 14px; }
        #approval-list li small { color: #888; font-size: 12px; display: block; margin-top: 2px; }
        #approval-list .empty { color: #888; text-align: center; padding: 20px 0; }
        #approval-list .refresh-btn { margin-top: 10px; width: 100%; padding: 8px; background: #e8e8e8; border: none; border-radius: 4px; cursor: pointer; }
        #approval-list .refresh-btn:hover { background: #ddd; }

        /* 上传进度条 */
        .upload-progress {
            display: none;
            margin: 10px 0;
            padding: 12px 16px;
            background: #f5f5f5;
            border-radius: 8px;
        }
        .upload-progress.active {
            display: block;
        }
        .upload-progress .progress-bar {
            width: 100%;
            height: 6px;
            background: #e0e0e0;
            border-radius: 3px;
            overflow: hidden;
            margin-top: 8px;
        }
        .upload-progress .progress-bar .fill {
            height: 100%;
            width: 0%;
            background: #1a73e8;
            border-radius: 3px;
            transition: width 0.3s ease;
        }
        .upload-progress .progress-text {
            font-size: 13px;
            color: #555;
        }

        /* ===== Trace 模态框 ===== */
        .trace-modal {
            display: none;
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0,0,0,0.5);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }
        .trace-modal.active { display: flex; }
        .trace-modal .modal-content {
            background: #fff;
            width: 90%;
            max-width: 800px;
            max-height: 80vh;
            border-radius: 12px;
            padding: 24px;
            overflow-y: auto;
            box-shadow: 0 4px 20px rgba(0,0,0,0.3);
        }
        .trace-modal .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #eee;
            padding-bottom: 12px;
            margin-bottom: 16px;
        }
        .trace-modal .modal-header h3 { margin: 0; }
        .trace-modal .modal-close {
            background: none;
            border: none;
            font-size: 24px;
            cursor: pointer;
            color: #888;
        }
        .trace-modal .modal-close:hover { color: #333; }
        .trace-step {
            border-left: 3px solid #1a73e8;
            padding-left: 16px;
            margin-bottom: 16px;
            background: #f8f9fa;
            border-radius: 4px;
            padding: 12px 16px;
        }
        .trace-step .step-header {
            font-weight: bold;
            color: #1a73e8;
            margin-bottom: 4px;
        }
        .trace-step .step-header .step-time {
            font-weight: normal;
            color: #888;
            font-size: 12px;
            margin-left: 8px;
        }
        .trace-step .step-detail {
            font-size: 13px;
            color: #333;
            white-space: pre-wrap;
            word-wrap: break-word;
        }
        .trace-step .step-detail code {
            background: #e8e8e8;
            padding: 2px 6px;
            border-radius: 3px;
            font-size: 12px;
        }
        .trace-step .step-detail .tool-list {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
            margin-top: 4px;
        }
        .trace-step .step-detail .tool-tag {
            background: #e8f0fe;
            color: #1a73e8;
            padding: 2px 10px;
            border-radius: 12px;
            font-size: 12px;
        }
        .trace-btn {
            font-size: 12px;
            color: #888;
            background: none;
            border: none;
            cursor: pointer;
            margin-top: 4px;
            padding: 2px 8px;
            border-radius: 4px;
        }
        .trace-btn:hover {
            background: #f0f0f0;
            color: #1a73e8;
        }
    </style>
</head>
<body>

    <h2>🏥 医学问答助手</h2>

    <div class="main-container">

        <!-- ===== 侧边栏 ===== -->
        <div class="sidebar" id="sidebar">
            <div class="tab-btn active" data-tab="chat" onclick="switchTab('chat')">💬 医药助手</div>
            <div class="tab-btn" data-tab="approval" onclick="switchTab('approval')">
                📋 审批助手
                <span class="badge" id="approval-badge">0</span>
            </div>
            <div class="tab-content active" id="tab-chat">
                <p>当前租户：<span id="tenant-display">default</span></p>
                <p style="font-size:12px; color:#aaa;">💡 智能问诊输入「我是XXX」绑定患者</p>
            </div>
            <div class="tab-content" id="tab-approval">
                <div id="approval-list"><p class="empty">加载中...</p></div>
                <button class="refresh-btn" onclick="refreshApprovals()">🔄 刷新</button>
            </div>
        </div>

        <!-- ===== 聊天区 ===== -->
        <div class="chat-area">
            <div class="mode-selector">
                <button id="mode-quick" class="mode-btn active" onclick="setMode('quick')">⚡ 快速问答</button>
                <button id="mode-consult" class="mode-btn" onclick="setMode('consult')">🩺 智能问诊</button>
            </div>
            <div id="chat"></div>

            <!-- 上传进度条 -->
            <div class="upload-progress" id="uploadProgress">
                <div class="progress-text" id="progressText">📤 正在上传...</div>
                <div class="progress-bar">
                    <div class="fill" id="progressFill"></div>
                </div>
            </div>

            <div class="input-area">
                <!-- 文件上传按钮 -->
                <input type="file" id="fileInput" accept=".png,.jpg,.jpeg,.pdf,.docx,.xlsx" style="display:none;">
                <button onclick="document.getElementById('fileInput').click()" style="padding:10px 16px; background:#1a73e8; color:#ffffff; border:none; border-radius:6px; cursor:pointer; font-weight:500; white-space:nowrap;">📎 上传文件</button>
                <input type="text" id="question" placeholder="输入医学问题..." />
                <button onclick="send()">发送</button>
            </div>
        </div>
    </div>

    <!-- ===== Trace 模态框（移到聊天区外部） ===== -->
    <div class="trace-modal" id="traceModal">
        <div class="modal-content">
            <div class="modal-header">
                <h3>🔍 推理过程</h3>
                <button class="modal-close" onclick="closeTrace()">&times;</button>
            </div>
            <div id="traceBody">
                <p style="color:#888;">加载中...</p>
            </div>
        </div>
    </div>

    <script>
        // ============================================================
        // 会话 ID 管理
        // ============================================================
        function getSessionId() {
            let sessionId = localStorage.getItem('med_agent_session_id');
            if (!sessionId) {
                sessionId = 'session_' + Date.now() + '_' + Math.random().toString(36).substring(2, 8);
                localStorage.setItem('med_agent_session_id', sessionId);
            }
            return sessionId;
        }

        const SESSION_ID = getSessionId();
        console.log('[Session] ID:', SESSION_ID);

        // ============================================================
        // 全局状态
        // ============================================================
        let currentMode = 'quick';
        let currentTab = 'chat';

        // 三个独立的对话历史
        const conversations = {
            chat_quick: [],
            chat_consult: [],
            approval: []
        };

        // 请求 ID 管理（用于丢弃过期的异步响应）
        let activeRequestId = 0;

        // ============================================================
        // 获取当前会话的 key
        // ============================================================
        function getCurrentConversationKey() {
            if (currentTab === 'approval') return 'approval';
            if (currentMode === 'quick') return 'chat_quick';
            return 'chat_consult';
        }

        function getCurrentConversation() {
            return conversations[getCurrentConversationKey()] || [];
        }

        // ============================================================
        // 模式切换
        // ============================================================
        function setMode(mode) {
            activeRequestId++;
            currentMode = mode;
            document.getElementById('mode-quick').classList.toggle('active', mode === 'quick');
            document.getElementById('mode-consult').classList.toggle('active', mode === 'consult');

            const chatDiv = document.getElementById('chat');
            chatDiv.innerHTML = '';
            const key = getCurrentConversationKey();
            const saved = conversations[key] || [];
            saved.forEach(msg => {
                renderMessage(msg.role, msg.content, msg.tools || null, null);
            });
        }

        // ============================================================
        // Tab 切换
        // ============================================================
        function switchTab(tab) {
            activeRequestId++;
            currentTab = tab;

            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            document.querySelector(`.tab-btn[data-tab="${tab}"]`).classList.add('active');
            document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
            document.getElementById(`tab-${tab}`).classList.add('active');

            const chatDiv = document.getElementById('chat');
            chatDiv.innerHTML = '';
            const key = getCurrentConversationKey();
            const saved = conversations[key] || [];
            saved.forEach(msg => {
                renderMessage(msg.role, msg.content, msg.tools || null, null);
            });

            const modeSelector = document.querySelector('.mode-selector');
            if (tab === 'approval') {
                modeSelector.style.display = 'none';
                refreshApprovals();
            } else {
                modeSelector.style.display = 'flex';
            }
        }

        // ============================================================
        // 渲染消息（修复：增加 traceSessionId 参数）
        // ============================================================
        function renderMessage(role, text, toolsUsed = null, traceSessionId = null) {
            const chatDiv = document.getElementById('chat');
            const msgDiv = document.createElement('div');
            msgDiv.className = role;

            let formattedText = text.replace(/\n/g, '<br>');
            formattedText = formattedText.replace(
                /\[([^\]]+)\]\(([^)]+)\)/g,
                function(match, linkText, url) {
                    if (url.startsWith('/reports/')) {
                        url = window.location.origin + url;
                    }
                    return '<a href="' + url + '" target="_blank" download>' + linkText + '</a>';
                }
            );

            msgDiv.innerHTML = `<strong>${role === 'user' ? '您' : '助手'}:</strong> ${formattedText}`;
            if (toolsUsed && toolsUsed.length) {
                const toolSpan = document.createElement('div');
                toolSpan.className = 'tool-info';
                toolSpan.innerText = `🔧 使用工具: ${toolsUsed.join(', ')}`;
                msgDiv.appendChild(toolSpan);
            }

            // 如果是助手消息且有 trace session，添加按钮
            if (role === 'assistant' && traceSessionId && currentMode === 'quick') {
                const traceBtn = document.createElement('button');
                traceBtn.className = 'trace-btn';
                traceBtn.textContent = '🔍 查看推理过程';
                traceBtn.onclick = () => showTrace(traceSessionId);
                msgDiv.appendChild(traceBtn);
            }

            chatDiv.appendChild(msgDiv);
            chatDiv.scrollTop = chatDiv.scrollHeight;
        }

        // ============================================================
        // 审批列表刷新
        // ============================================================
        async function refreshApprovals() {
            try {
                const resp = await fetch('/approvals', {
                    headers: { 'X-Tenant-ID': 'default' }
                });
                const data = await resp.json();
                console.log('[DEBUG] /approvals 返回:', data);

                document.getElementById('approval-badge').innerText = data.count || 0;

                const listDiv = document.getElementById('approval-list');
                if (data.items && data.items.length) {
                    let html = '<ul>';
                    data.items.forEach(item => {
                        html += `
                            <li>
                                <strong>${item.id}</strong> ${item.title}
                                <small>申请人：${item.requester}  ${item.created_at}</small>
                            </li>
                        `;
                    });
                    html += '</ul>';
                    listDiv.innerHTML = html;
                } else {
                    listDiv.innerHTML = '<p class="empty">✅ 暂无待审批项</p>';
                }
            } catch (err) {
                console.error('刷新审批列表失败:', err);
                document.getElementById('approval-list').innerHTML = '<p class="empty">⚠️ 加载失败</p>';
            }
        }

        // ============================================================
        // 文件上传逻辑
        // ============================================================
        document.getElementById('fileInput').addEventListener('change', function(e) {
            const file = this.files[0];
            if (!file) return;

            const validExtensions = ['.png', '.jpg', '.jpeg', '.pdf', '.docx', '.xlsx'];
            const fileExt = '.' + file.name.split('.').pop().toLowerCase();
            if (!validExtensions.includes(fileExt)) {
                alert('仅支持 PNG、JPG、PDF、DOCX、XLSX 格式');
                this.value = '';
                return;
            }

            const progressContainer = document.getElementById('uploadProgress');
            const progressFill = document.getElementById('progressFill');
            const progressText = document.getElementById('progressText');
            progressContainer.classList.add('active');
            progressFill.style.width = '0%';
            progressText.textContent = '📤 正在上传文件...';

            const formData = new FormData();
            formData.append('file', file);
            formData.append('module', 'consult');

            renderMessage('user', `📎 上传文件：${file.name}`, null, null);
            const key = getCurrentConversationKey();
            const conv = conversations[key];
            conv.push({ role: 'user', content: `上传文件：${file.name}`, tools: null });

            const xhr = new XMLHttpRequest();
            xhr.open('POST', '/upload');
            xhr.setRequestHeader('X-Session-ID', SESSION_ID);

            xhr.upload.addEventListener('progress', function(e) {
                if (e.lengthComputable) {
                    const percent = Math.round((e.loaded / e.total) * 100);
                    progressFill.style.width = percent + '%';
                    progressText.textContent = `📤 上传中... ${percent}%`;
                    if (percent === 100) {
                        progressText.textContent = '⏳ 正在解析文件内容...';
                    }
                }
            });

            xhr.onload = function() {
                progressContainer.classList.remove('active');
                if (xhr.status === 200) {
                    try {
                        const data = JSON.parse(xhr.responseText);
                        if (data.success) {
                            const content = data.content;
                            const systemMsg = `【文件内容】\n${content}`;
                            const preview = content.substring(0, 200) + (content.length > 200 ? '...' : '');
                            renderMessage('assistant', `📄 已解析文件 ${file.name}，识别内容如下：\n\n${preview}\n\n（可继续提问）`, null, null);
                            conv.push({ role: 'system', content: systemMsg, tools: null });
                        } else {
                            renderMessage('assistant', `❌ 文件解析失败：${data.error || '未知错误'}`, null, null);
                            conv.push({ role: 'assistant', content: `文件解析失败：${data.error || '未知错误'}`, tools: null });
                        }
                    } catch (err) {
                        renderMessage('assistant', `❌ 解析响应失败：${err.message}`, null, null);
                        conv.push({ role: 'assistant', content: `解析响应失败：${err.message}`, tools: null });
                    }
                } else {
                    renderMessage('assistant', `❌ 上传失败 (HTTP ${xhr.status})`, null, null);
                    conv.push({ role: 'assistant', content: `上传失败 (HTTP ${xhr.status})`, tools: null });
                }
            };

            xhr.onerror = function() {
                progressContainer.classList.remove('active');
                renderMessage('assistant', '❌ 网络错误，请检查服务是否运行', null, null);
                conv.push({ role: 'assistant', content: '网络错误，请检查服务是否运行', tools: null });
            };

            xhr.ontimeout = function() {
                progressContainer.classList.remove('active');
                renderMessage('assistant', '❌ 上传超时，请重试', null, null);
                conv.push({ role: 'assistant', content: '上传超时，请重试', tools: null });
            };

            xhr.timeout = 60000;
            xhr.send(formData);
            this.value = '';
        });

        // ============================================================
        // 发送消息（修复：增加 traceSessionId 和 convType）
        // ============================================================
        async function send() {
            const input = document.getElementById('question');
            const q = input.value.trim();
            if (!q) return;
            input.value = '';

            // 确定 conversation type
            let convType = 'quick';
            if (currentTab === 'approval') {
                convType = 'approval';
            } else if (currentMode === 'consult') {
                convType = 'consult';
            }

            const key = getCurrentConversationKey();
            const conv = conversations[key];

            renderMessage('user', q, null, null);
            conv.push({ role: 'user', content: q, tools: null });

            const thisRequestId = ++activeRequestId;
            const traceSessionId = 'trace_' + Date.now() + '_' + Math.random().toString(36).substring(2, 6);
            const traceQuestion = q.length > 200 ? q.substring(0, 200) + '...' : q;

            try {
                // 🆕 启动 trace（检查响应状态）
                try {
                    const traceResp = await fetch('/trace/start', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ session_id: traceSessionId, question: traceQuestion })
                    });
                    if (!traceResp.ok) {
                        const errorText = await traceResp.text();
                        console.warn('[Trace] 启动失败 (HTTP ' + traceResp.status + '):', errorText);
                    } else {
                        console.log('[Trace] 启动成功:', traceSessionId);
                    }
                } catch (traceErr) {
                    console.warn('[Trace] 启动失败 (网络错误):', traceErr);
                }

                let endpoint;
                if (currentTab === 'approval') {
                    endpoint = '/ask';
                } else {
                    endpoint = currentMode === 'quick' ? '/ask' : '/consult';
                }

                const resp = await fetch(endpoint, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'X-Session-ID': SESSION_ID,
                        'X-Conversation-Type': convType,
                        'X-Trace-ID': traceSessionId
                    },
                    body: JSON.stringify({
                        question: q,
                        history: conv.slice(0, -1)
                    })
                });
                const data = await resp.json();

                if (thisRequestId !== activeRequestId) {
                    console.log('丢弃过期响应，请求 ID:', thisRequestId);
                    return;
                }

                const answer = data.result?.answer || '请求失败：请检查后端日志';
                const toolsUsed = data.result?.tools_used || [];

                renderMessage('assistant', answer, toolsUsed, traceSessionId);
                conv.push({ role: 'assistant', content: answer, tools: toolsUsed });

                if (currentTab === 'approval') {
                    setTimeout(refreshApprovals, 1000);
                }
            } catch (err) {
                if (thisRequestId !== activeRequestId) return;
                renderMessage('assistant', '请求失败：' + err.message, null, null);
                conv.push({ role: 'assistant', content: '请求失败：' + err.message, tools: null });
            }
        }
        // ============================================================
        // 回车发送
        // ============================================================
        document.getElementById('question').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') send();
        });

        // ============================================================
        // 页面加载后初始化
        // ============================================================
        document.addEventListener('DOMContentLoaded', function() {
            switchTab('chat');
            loadHistory();
        });

        async function loadHistory() {
            try {
                const resp = await fetch(`/history?session_id=${SESSION_ID}&limit=50`);
                const data = await resp.json();
                console.log('[DEBUG] loadHistory 返回数据:', data);
                if (data.success && data.items.length > 0) {
                    data.items.forEach(item => {
                        const key = item.conversation_type === 'quick' ? 'chat_quick' :
                            item.conversation_type === 'consult' ? 'chat_consult' : 'approval';
                        if (!conversations[key]) {
                            conversations[key] = [];
                        }
                        if (item.role === 'user' || item.role === 'assistant') {
                            conversations[key].push({
                                role: item.role,
                                content: item.content,
                                tools: item.tools_used || null
                            });
                        }
                    });
                    refreshCurrentChat();
                }
            } catch (err) {
                console.error('加载历史记录失败:', err);
            }
        }

        function refreshCurrentChat() {
            const chatDiv = document.getElementById('chat');
            chatDiv.innerHTML = '';
            const key = getCurrentConversationKey();
            const saved = conversations[key] || [];
            saved.forEach(msg => {
                renderMessage(msg.role, msg.content, msg.tools || null, null);
            });
        }

        // ============================================================
        // Trace 功能
        // ============================================================
        let currentTraceSessionId = null;

        async function showTrace(sessionId) {
            currentTraceSessionId = sessionId;
            const modal = document.getElementById('traceModal');
            const body = document.getElementById('traceBody');

            body.innerHTML = '<p style="color:#888;">加载推理过程...</p>';
            modal.classList.add('active');

            try {
                const resp = await fetch(`/trace/${sessionId}`);
                const data = await resp.json();

                if (!data.success) {
                    body.innerHTML = `<p style="color:#e74c3c;">❌ ${data.error}</p>`;
                    return;
                }

                const trace = data.data;
                let html = `<p style="font-size:13px; color:#888; margin-bottom:12px;">问题：${trace.question}</p>`;
                html += `<p style="font-size:12px; color:#aaa; margin-bottom:16px;">耗时：${(trace.end_time - trace.start_time || 0).toFixed(2)}s</p>`;

                trace.steps.forEach((step) => {
                    const typeNames = {
                        'planner': '📋 Planner',
                        'executor': '⚡ Executor',
                        'retriever': '🔍 Retriever',
                        'synthesizer': '🧠 Synthesizer'
                    };
                    const typeName = typeNames[step.step_type] || step.step_type;
                    const time = new Date(step.timestamp * 1000).toLocaleTimeString();

                    html += `<div class="trace-step">`;
                    html += `<div class="step-header">${typeName} <span class="step-time">${time}</span></div>`;
                    html += `<div class="step-detail">`;

                    const d = step.data;
                    if (step.step_type === 'planner') {
                        html += `<div>📝 规则匹配结果：<code>${d.rule_result?.join(', ') || '无'}</code></div>`;
                        html += `<div>🤖 使用 LLM 规划：${d.used_llm ? '是' : '否'}</div>`;
                        html += `<div>✅ 最终工具：<div class="tool-list">${d.final_tools?.map(t => `<span class="tool-tag">${t}</span>`).join('') || '无'}</div></div>`;
                    } else if (step.step_type === 'executor') {
                        const status = d.success ? '✅' : '❌';
                        html += `<div>${status} 工具：<strong>${d.tool}</strong></div>`;
                        html += `<div>⏱️ 耗时：${d.duration?.toFixed(2)}s</div>`;
                        if (d.success && d.result_preview) {
                            html += `<div>📄 结果预览：${d.result_preview}</div>`;
                        }
                        if (!d.success && d.error) {
                            html += `<div style="color:#e74c3c;">❌ 错误：${d.error}</div>`;
                        }
                    } else if (step.step_type === 'retriever') {
                        html += `<div>🔍 原始查询：<code>${d.query}</code></div>`;
                        if (d.rewritten_queries) {
                            html += `<div>📝 改写查询：<br><code>${d.rewritten_queries.join('<br>')}</code></div>`;
                        }
                        if (d.result_count !== undefined) {
                            html += `<div>📊 检索到 ${d.result_count} 条结果</div>`;
                        }
                        if (d.top_result_preview) {
                            html += `<div>📄 最佳结果预览：${d.top_result_preview}</div>`;
                        }
                    } else if (step.step_type === 'synthesizer') {
                        if (d.tool_count !== undefined) {
                            html += `<div>📊 合成 ${d.tool_count} 个工具的结果</div>`;
                            html += `<div>🔧 工具来源：${d.tool_sources?.join(', ') || '无'}</div>`;
                        }
                        if (d.answer_preview) {
                            html += `<div>📄 合成答案预览：${d.answer_preview}</div>`;
                        }
                    }

                    html += `</div></div>`;
                });

                body.innerHTML = html;
            } catch (err) {
                body.innerHTML = `<p style="color:#e74c3c;">❌ 加载失败：${err.message}</p>`;
            }
        }

        function closeTrace() {
            document.getElementById('traceModal').classList.remove('active');
        }

        document.getElementById('traceModal').addEventListener('click', function(e) {
            if (e.target === this) closeTrace();
        });
    </script>
</body>
</html>
